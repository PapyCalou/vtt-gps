<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VTT-GPS</title>
<meta name="description" content="Mes traces GPS de VTT, gravel, route et randonnée">
<meta name="theme-color" content="#0f4c41">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VTT-GPS">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="app.css">
</head>
<body data-tab="sorties">
<div id="app">
  <nav id="tabs" aria-label="Rubriques">
    <span class="brand">VTT-GPS</span>
    <button data-tab="carte" class="only-mobile">Carte</button>
    <button data-tab="sorties">Sorties</button>
    <button data-tab="idees">Idées</button>
    <button data-tab="velos">Vélos</button>
    <button data-tab="reglages">Réglages</button>
  </nav>
  <main>
    <section id="panel" aria-live="polite"></section>
    <div id="mapwrap">
      <div id="map"></div>
      <button id="locate" data-act="locate" title="Me localiser" aria-label="Me localiser">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
      </button>
    </div>
  </main>
</div>
<input type="file" id="file" multiple hidden>
<input type="file" id="restore" hidden>
<div id="toast" role="status"></div>
<div id="drop">Déposez vos fichiers GPX ici</div>
<script src="vendor/leaflet/leaflet.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
